[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smellnet"
version = "0.1.0"
description = "A neural code-smell detector for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.scripts]
smellnet = "run:main"

[tool.setuptools]
py-modules = ["run"]
packages = ["smellnet"]
